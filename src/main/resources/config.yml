settings:
  use-slayer-trackers: true

messages:
  traker-removed: "&d&lCOSMIC &8&l▶ &7You have removed tracker from item in hand."
  traker-received: "&d&lCOSMIC &8&l▶ &7You have received %amount%x Entity Trackers."
  traker-given: "&d&lCOSMIC &8&l▶ &7You have given &d%amount%x Entity Tracker's &7to &d%player%&7."
  already-exist: "&eStat traker already exist on this item."
  invalid-item: "&cYou cannot apply stat traker to this item."

stack-trak-remover:
  return-traker: true
  type: INK_SAC
  name: "&cStat Trak Remover"
  lore:
    - "&7Apply to remove tracker from item"

stat-trak-arrows-shot:
  item-name: "&7[&d&lARROWS SHOT&7]"
  item-lore:
    - "&7Click this item on top of a weapon to start tracking stats."
    - ""
    - "&f&lValid Items:"
    - "&7- Crossbow"
    - "&7- Bow"
  trak-lore: "&dArrows shot: &f%amount%"

stat-trak-bossmob:
  item-name: "&7[&9&lBOSSMOB TRAKER &7]"
  item-lore:
    - "&7Click this item on top of a sword, axe, or spear to start tracking stats."
  trak-lore: "&7Boss Mobs Killed: &f%amount%"
  items:
    - DIAMOND_SWORD

